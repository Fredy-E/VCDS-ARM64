# Documentation-only CI: validates Markdown links, heading anchors, the README
# index, and private-path hygiene. Nothing is built, tested, or distributed here.
name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Doc link checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run dependency-free doc checks
        run: python3 tools/check_docs.py
